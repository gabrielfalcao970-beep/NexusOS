<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1117">
    <meta name="description" content="NexusOS — seu assistente pessoal inteligente.">
    <title>NexusOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="desktop-screen" class="screen">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">N</span>
                <div>
                    <h1>NexusOS</h1>
                    <p>Seu assistente pessoal</p>
                </div>
            </div>
        </header>

        <main class="workspace">
            <section class="chat-container" aria-label="Conversa com NexusOS">
                <div id="chat-messages" class="chat-messages" aria-live="polite" aria-relevant="additions">
                    <div class="message ai-message">
                        Olá! Sou o NexusOS. Como posso ajudar você hoje?
                    </div>
                </div>
                <form id="chat-form" class="chat-input-area">
                    <label class="visually-hidden" for="user-input">Sua mensagem</label>
                    <input type="text" id="user-input" placeholder="Digite sua mensagem para o NexusOS..." autocomplete="off" maxlength="4000" required>
                    <button id="send-btn" type="submit">Enviar</button>
                </form>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
