<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusOS</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div id="auth-screen" class="screen">
        <div class="auth-card">
            <h1>NexusOS</h1>
            <p>Sistema Operacional Integrado de Assistência Pessoal</p>
            <button id="google-login-btn">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.84 2.07-1.78 2.71v2.26h2.88c1.68-1.55 2.7-3.83 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.88-2.26c-.81.54-1.85.86-3.08.86-2.34 0-4.33-1.58-5.04-3.71H1.03v2.33C2.55 15.95 5.51 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H1.03C.37 6.28 0 7.8 0 9.42s.37 3.14 1.03 4.46l2.93-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.51 0 2.55 2.05 1.03 4.96l2.93 2.33c.71-2.13 2.7-3.71 5.04-3.71z"/></svg>
                Entrar com Conta Google
            </button>
        </div>
    </div>

    <div id="desktop-screen" class="screen hidden">
        <header class="topbar">
            <div class="user-info">
                <img id="user-avatar" src="" alt="Avatar">
                <span id="user-name">Usuário</span>
            </div>
            <div class="telemetry-info" id="telemetry-display">
                Carregando telemetria...
            </div>
            <button id="logout-btn">Sair</button>
        </header>

        <main class="workspace">
            <div class="chat-container">
                <div id="chat-messages" class="chat-messages">
                    <div class="message ai-message">
                        Olá. Conexão estabelecida com sucesso. Eu sou o NexusOS, seu ambiente inteligente integrado. Como posso auxiliar hoje?
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="user-input" placeholder="Digite sua mensagem para o NexusOS..." autocomplete="off">
                    <button id="send-btn">Enviar</button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
